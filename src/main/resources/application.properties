spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthnexus}

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

server.port=${SERVER_PORT:8080}

# MySQL UUID mapping
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:604800000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000}

# =========================================================
# EMAIL CONFIGURATION
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Frontend URLs & Verification
app.password-reset.frontend-url=http://localhost:8081/reset-password
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:8081}
email.verification.expiration-ms=${EMAIL_VERIFICATION_EXPIRATION_MS:86400000}
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# =========================================================
# REMINDER SCHEDULER CONFIGURATION
# =========================================================

reminder.scheduler.fixed-rate-ms=${REMINDER_SCHEDULER_FIXED_RATE_MS:60000}
reminder.scheduler.initial-delay-ms=${REMINDER_SCHEDULER_INITIAL_DELAY_MS:15000}
reminder.appointment.minutes-before=${REMINDER_APPOINTMENT_MINUTES_BEFORE:60}
reminder.queue.patients-ahead=${REMINDER_QUEUE_PATIENTS_AHEAD:2}
